model:
  arch: blip2_t5_multimodal
  model_type: pretrain_flant5xl
  load_pretrained: False
  load_finetuned: True

  finetuned: "./weights/AudioCaps_best.pth"

  image_size: 224
  drop_path_rate: 0
  use_grad_checkpoint: False
  vit_precision: "fp16"
  freeze_vit: True

  # LoRA
  
  lora: True
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.

  # Q-Former
  num_query_token: 32

  # T5
  t5_model: "google/flan-t5-xl"

  # generation configs
  prompt: "An audio of "

datasets:
  AudioCaps_caption: # name of the dataset builder
    vis_processor:
        train:
          name: "alpro_video_train"
          n_frms: 16
          image_size: 224
        eval:
          name: "alpro_video_eval"
          n_frms: 16
          image_size: 224
    text_processor:
        train:
          name: "blip_caption"
        eval:
          name: "blip_caption"

run:
  task: captioning
  batch_size_train: 16
  batch_size_eval: 8
  num_workers: 2

  max_len: 50
  min_len: 3
  num_beams: 6
  length_penalty: 1.25
  repetition_penalty: 1.25

  seed: 42
  output_dir: "output/Video-BLIP2/FLAN-T5-XL/Caption_AudioCaps_Eval"

  evaluate: True
  test_splits: ["test"]

  device: "cuda"
  world_size: 2
  dist_url: "env://"
  distributed: True
