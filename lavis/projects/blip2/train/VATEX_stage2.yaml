model:
  arch: blip2_t5_multimodal
  model_type: pretrain_flant5xl
  load_finetuned: True
  finetuned:  #Path of the checkpoint from stage 1
  
  image_size: 224
  drop_path_rate: 0
  use_grad_checkpoint: False
  vit_precision: "fp16"
  freeze_vit: True
  freeze_audio: True

  # LoRA
  lora: True
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.2

  #Q-Former 
  num_aud_query_token: 16
  num_vis_query_token: 32
  cross_attention_freq: 2

  # T5
  t5_model: "google/flan-t5-xl"

  # generation configs
  prompt: "a video of"


datasets:
  vatex_caption:  # name of the dataset builder
    vis_processor:
      train:
        name: "alpro_video_train"
        n_frms: 16
        image_size: 224
      eval:
        name: "alpro_video_eval"
        n_frms: 16
        image_size: 224

    text_processor:
      train:
        name: "blip_caption"
      eval:
        name: "blip_caption"


run:
  # runner: runner_iter
  # max_iters: 30000
  # iters_per_inner_epoch: 1000

  task: captioning

  # optimizer
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-5
  min_lr: 1e-6
  warmup_lr: 1e-8
  warmup_steps: 1000
  weight_decay: 0.05

  max_epoch: 10
  batch_size_train: 16
  batch_size_eval: 16
  num_workers: 2
  accum_grad_iters: 1


  # generation
  max_len: 32
  min_len: 5
  num_beams: 5

  seed: 42
  output_dir: "output/Video-BLIP2/FLAN-T5-XL/VATEX_stage2"

  amp: True
  resume_ckpt_path: null

  evaluate: False
  train_splits: ["train"]
  valid_splits: ["val"]
  test_splits: ["test"]

  device: "cuda"
  world_size: 2
  dist_url: "env://"
  distributed: True
