model:
  arch: blip2_t5
  model_type: pretrain_flant5xl
  load_pretrained: False
  load_finetuned: True

  pretrained: "https://storage.googleapis.com/sfr-vision-language-research/LAVIS/models/BLIP2/blip2_pretrained_flant5xl.pth"

  image_size: 224
  drop_path_rate: 0
  use_grad_checkpoint: False
  vit_precision: "fp16"
  freeze_vit: True

  # LoRA
  lora: True
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05

  # Q-Former
  num_query_token: 32

  # T5
  t5_model: "google/flan-t5-xl"

  # generation configs
  prompt: "a video of"

datasets:
  vatex_caption: # name of the dataset builder
    vis_processor:
        train:
          name: "alpro_video_train"
          n_frms: 16
          image_size: 224
        eval:
          name: "alpro_video_eval"
          n_frms: 16
          image_size: 224
    text_processor:
        train:
          name: "blip_caption"
        eval:
          name: "blip_caption"

run:
  runner: runner_iter
  max_iters: 10000 
  iters_per_inner_epoch: 1

  task: captioning
  # optimizer
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-5
  min_lr: 1e-6
  warmup_lr: 1e-8
  warmup_steps: 1000
  weight_decay: 0.05
  max_epoch: 20
  batch_size_train: 16
  batch_size_eval: 16
  num_workers: 4
  accum_grad_iters: 1

  max_len: 32
  min_len: 5
  num_beams: 5

  seed: 42
  output_dir: "output/Video-BLIP2/FLAN-T5-XL/Caption_vatex"

  amp: True
  resume_ckpt_path: null

  evaluate: False
  train_splits: ["train"]
  valid_splits: ["test"]
  test_splits: ["test"]

  device: "cuda"
  world_size: 2
  dist_url: "env://"
  distributed: True
