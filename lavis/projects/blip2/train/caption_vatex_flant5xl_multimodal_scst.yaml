model:
  arch: blip2_t5_multimodal
  model_type: pretrain_flant5xl
  load_pretrained: False
  load_finetuned: True

  # pretrained: "/home/abrimont/partage/mllm-video-captioner/cache_dir/blip2_models/blip2_pretrained_flant5xl.pth"
  # pretrained: "/home/abrimont/partage/mllm-video-captioner/blip2_pretrained_flant5xl.pth"
  # finetuned: "/home/abrimont/partage/mllm-video-captioner/lavis/output/Video-BLIP2/FLAN-T5-XL/Caption_vatex_audio/20250822202/checkpoint_best.pth"
  finetuned: "/home/abrimont/partage/mllm-video-captioner/lavis/output/Video-BLIP2/FLAN-T5-XL/Caption_vatex_audio/20250829172/checkpoint_best.pth"
  
  image_size: 224
  drop_path_rate: 0
  use_grad_checkpoint: False
  vit_precision: "fp16"
  freeze_vit: True

  # LoRA
  lora: True
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05

  # Q-Former
  num_query_token: 32

  # T5
  t5_model: "google/flan-t5-xl"

  # generation configs
  prompt: "describe the video:"

  scst: True  

datasets:
  vatex_caption_audio: # name of the dataset builder
    vis_processor:
        train:
          name: "alpro_video_train"
          n_frms: 8
          image_size: 224
        eval:
          name: "alpro_video_eval"
          n_frms: 8
          image_size: 224
    text_processor:
        train:
          name: "blip_caption"
        eval:
          name: "blip_caption"
    
run:
  runner: runner_iter
  max_iters: 40000
  iters_per_inner_epoch: 1000

  task: captioning
  # optimizer
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 5e-6
  min_lr: 1e-6
  warmup_lr: 1e-8
  warmup_steps: 2000
  weight_decay: 0.05
  max_epoch: 10
  batch_size_train: 1 ### RTX-A6000
  batch_size_eval: 16
  num_workers: 1
  accum_grad_iters: 8

  max_len: 32
  min_len: 5
  num_beams: 5

  seed: 42
  output_dir: "output/Video-BLIP2/FLAN-T5-XL/Caption_vatex_audio_scst"

  amp: True
  resume_ckpt_path: null

  evaluate: False
  train_splits: ["train"]
  valid_splits: ["val"]
  test_splits: ["test"]

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True
